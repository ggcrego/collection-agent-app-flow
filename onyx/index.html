  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

)  ----- */\n  --neutral-0:    #FFFFFF;\n  --neutral-50:   #FAFAFA;\n  --neutral-100:  #F5F5F5;\n  --neutral-200:  #E5E5E5;\n  --neutral-300:  #D4D4D4;\n  --neutral-400:  #A3A3A3;\n  --neutral-500:  #737373;\n  --neutral-600:  #525252;\n  --neutral-700:  #404040;\n  --neutral-800:  #262626;\n  --neutral-900:  #171717;\n  --neutral-950:  #0A0A0A;\n\n  /* --- Semantic — light theme (admin shell default) ------------------- */\n  --bg:                   var(--neutral-0);\n  --bg-subtle:            var(--neutral-50);\n  --bg-muted:             #F7F7F7;\n  --fg:                   #0A0A0A;\n  --fg-muted:             #737373;\n  --fg-subtle:            #A3A3A3;\n  --border:               #E5E5E5;\n  --border-strong:        #D4D4D4;\n  --ring:                 #B4B4B4;\n\n  --card:                 var(--neutral-0);\n  --card-fg:              #0A0A0A;\n  --popover:              var(--neutral-0);\n  --popover-fg:           #0A0A0A;\n\n  --primary:              #1A1A1A;           /* product shell primary = near-black */\n  --primary-fg:           #FAFAFA;\n  --secondary:            #F5F5F5;\n  --secondary-fg:         #1A1A1A;\n  --muted:                #F5F5F5;\n  --muted-fg:             #737373;\n  --accent:               #F5F5F5;\n  --accent-fg:            #1A1A1A;\n\n  --sidebar:              #FAFAFA;\n  --sidebar-fg:           #0A0A0A;\n  --sidebar-border:       #E5E5E5;\n  --sidebar-accent:       #F5F5F5;\n\n  /* Status / feedback — shadcn semantics mapped to Crego brand where it makes sense */\n  --success:              var(--crego-green);\n  --success-fg:           #FFFFFF;\n  --info:                 var(--crego-blue);\n  --info-fg:              #FFFFFF;\n  --warning:              var(--crego-orange);\n  --warning-fg:           #1A1A1A;\n  --destructive:          var(--crego-red);\n  --destructive-fg:       #FFFFFF;\n\n  --accent-blue-bg:       #E0EBFF;           /* tinted info surface (omni-web) */\n  --accent-blue-fg:       #1848C8;\n\n  /* Chart palette (flow-web uses graded blues; we surface the full brand set) */\n  --chart-1: var(--crego-blue);\n  --chart-2: var(--crego-green);\n  --chart-3: var(--crego-orange);\n  --chart-4: var(--crego-dark);\n  --chart-5: var(--crego-red);\n\n  /* --- Radii ---------------------------------------------------------- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;\n  --radius-md: 8px;\n  --radius:    10px;   /* flow-web uses 0.625rem ≈ 10px */\n  --radius-lg: 12px;\n  --radius-xl: 16px;\n  --radius-2xl: 20px;\n  --radius-full: 9999px;\n\n  /* --- Spacing scale (4px base, Tailwind-aligned) --------------------- */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* --- Shadows (subtle, product feel) --------------------------------- */\n  --shadow-xs: 0 1px 0 0 rgba(0, 0, 0, 0.04);\n  --shadow-sm: 0 1px 2px 0 rgba(0, 21, 85, 0.05);\n  --shadow:    0 1px 3px 0 rgba(0, 21, 85, 0.08), 0 1px 2px -1px rgba(0, 21, 85, 0.05);\n  --shadow-md: 0 4px 8px -2px rgba(0, 21, 85, 0.08), 0 2px 4px -2px rgba(0, 21, 85, 0.04);\n  --shadow-lg: 0 12px 24px -6px rgba(0, 21, 85, 0.10), 0 4px 8px -4px rgba(0, 21, 85, 0.05);\n  --shadow-xl: 0 24px 48px -12px rgba(0, 21, 85, 0.14);\n  --shadow-focus: 0 0 0 3px rgba(41, 93, 239, 0.25);\n\n  /* --- Typography: families ------------------------------------------- */\n  --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',\n               Helvetica, Arial, sans-serif;\n  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n  --font-display: 'Plus Jakarta Sans', 'Geist', ui-sans-serif, system-ui, sans-serif;\n\n  /* --- Typography: sizes ---------------------------------------------- */\n  --fs-xs:    12px;\n  --fs-sm:    14px;\n  --fs-base:  16px;\n  --fs-md:    16px;\n  --fs-lg:    18px;\n  --fs-xl:    20px;\n  --fs-2xl:   24px;\n  --fs-3xl:   30px;\n  --fs-4xl:   36px;\n  --fs-5xl:   48px;\n  --fs-6xl:   60px;\n\n  --lh-tight:   1.15;\n  --lh-snug:    1.3;\n  --lh-normal:  1.5;\n  --lh-relaxed: 1.65;\n\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n  --fw-black:    800;\n\n  --tracking-tight:  -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.02em;\n\n  /* Header/layout */\n  --header-height: 56px;\n}\n\n/* --- Dark theme (applied via .dark on root) -------------------------- */\n.dark, [data-theme=\"dark\"] {\n  --bg:           #0A0A0A;\n  --bg-subtle:    #111111;\n  --bg-muted:     #171717;\n  --fg:           #FAFAFA;\n  --fg-muted:     #A3A3A3;\n  --fg-subtle:    #737373;\n  --border:       #262626;\n  --border-strong:#404040;\n\n  --card:         #141414;\n  --card-fg:      #FAFAFA;\n  --popover:      #1A1A1A;\n  --popover-fg:   #FAFAFA;\n\n  --primary:      #FAFAFA;\n  --primary-fg:   #1A1A1A;\n  --secondary:    #262626;\n  --secondary-fg: #FAFAFA;\n  --muted:        #262626;\n  --muted-fg:     #A3A3A3;\n  --accent:       #262626;\n  --accent-fg:    #FAFAFA;\n\n  --sidebar:         #141414;\n  --sidebar-fg:      #FAFAFA;\n  --sidebar-border:  #262626;\n  --sidebar-accent:  #262626;\n}\n\n/* ==========================================================================\n   Semantic type classes — use these rather than raw size/weight utilities.\n   ========================================================================== */\n\n.type-display {\n  font-family: var(--font-display);\n  font-size: var(--fs-6xl);\n  line-height: var(--lh-tight);\n  font-weight: var(--fw-black);\n  letter-spacing: var(--tracking-tight);\n  color: var(--crego-dark);\n}\n\n.type-h1 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-4xl);\n  line-height: var(--lh-tight);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n\n.type-h2 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-3xl);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n\n.type-h3 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-2xl);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-semibold);\n  color: var(--fg);\n}\n\n.type-h4 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-xl);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-semibold);\n  color: var(--fg);\n}\n\n.type-h5 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-lg);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-semibold);\n  color: var(--fg);\n}\n\n.type-body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-base);\n  line-height: var(--lh-normal);\n  font-weight: var(--fw-regular);\n  color: var(--fg);\n}\n\n.type-body-sm {\n  font-family: var(--font-sans);\n  font-size: var(--fs-sm);\n  line-height: var(--lh-normal);\n  font-weight: var(--fw-regular);\n  color: var(--fg);\n}\n\n.type-label {\n  font-family: var(--font-sans);\n  font-size: var(--fs-sm);\n  line-height: 1.3;\n  font-weight: var(--fw-medium);\n  color: var(--fg);\n}\n\n.type-caption {\n  font-family: var(--font-sans);\n  font-size: var(--fs-xs);\n  line-height: 1.4;\n  font-weight: var(--fw-regular);\n  color: var(--fg-muted);\n}\n\n.type-eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--fs-xs);\n  line-height: 1.2;\n  font-weight: var(--fw-semibold);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--fg-muted);\n}\n\n.type-mono {\n  font-family: var(--font-mono);\n  font-size: var(--fs-sm);\n  line-height: var(--lh-normal);\n  font-weight: var(--fw-regular);\n  color: var(--fg);\n}\n\n.type-code {\n  font-family: var(--font-mono);\n  font-size: 0.875em;\n  padding: 0.1em 0.4em;\n  border-radius: var(--radius-xs);\n  background: var(--muted);\n  color: var(--destructive);\n}\n\n/* The signature Crego red dot — use where you'd otherwise put a period. */\n.crego-dot {\n  display: inline-block;\n  width: 0.55em;\n  height: 0.55em;\n  border-radius: 9999px;\n  background: var(--crego-red);\n  vertical-align: baseline;\n  margin-left: 0.04em;\n  transform: translateY(0.02em);\n}\n<\u002Fstyle>\n<script src=\"357d98af-ffdc-4dd1-8978-491e4a62ad0f\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box}\n  html,body{margin:0}\n  input,select,textarea,button{font-family:var(--font-sans)}\n  input:focus,select:focus,textarea:focus{outline:none;border-color:#295DEF;box-shadow:0 0 0 3px rgba(41,93,239,0.18)}\n  textarea{resize:vertical}\n  ::-webkit-scrollbar{width:10px;height:10px}\n  ::-webkit-scrollbar-thumb{background:#E3E3E3;border-radius:8px;border:2px solid transparent;background-clip:padding-box}\n  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}\n  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-32px,22px)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-screen-label=\"Onyx\" style=\"display:flex;height:100vh;width:100%;background:#fff;font-family:var(--font-sans);color:#0A0A0A;overflow:hidden\">\n\n  <!-- ============ SIDEBAR ============ -->\n  <aside style=\"width:248px;flex-shrink:0;background:#FAFAFA;border-right:1px solid #E5E5E5;display:flex;flex-direction:column;height:100vh;padding:16px 12px\">\n\n    <!-- logo -->\n    <div style=\"display:flex;align-items:center;gap:9px;padding:4px 6px 16px\">\n      <img src=\"dbb62b3f-0efd-40c2-ab88-eb685e51d7a1\" style=\"height:28px;width:auto\" alt=\"\">\n      <div style=\"display:flex;align-items:flex-end;gap:2px;line-height:1\">\n        <span style=\"font:800 20px var(--font-display);color:#001555;letter-spacing:-0.02em\">crego<\u002Fspan>\n        <span style=\"width:7px;height:7px;border-radius:9999px;background:#EA4335;margin-bottom:3px\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- search -->\n    <div style=\"display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid #E5E5E5;border-radius:10px;background:#fff\">\n      <i data-lucide=\"search\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n      <span style=\"font:400 14px var(--font-sans);color:#737373\">Search menu…<\u002Fspan>\n      <div style=\"margin-left:auto;display:flex;gap:3px\">\n        <span style=\"font:500 11px var(--font-mono);color:#A3A3A3;border:1px solid #E5E5E5;background:#fff;border-radius:4px;padding:1px 5px;min-width:18px;text-align:center\">⌘<\u002Fspan>\n        <span style=\"font:500 11px var(--font-mono);color:#A3A3A3;border:1px solid #E5E5E5;background:#fff;border-radius:4px;padding:1px 5px;min-width:18px;text-align:center\">K<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- nav -->\n    <nav style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-top:12px;padding-right:2px\">\n\n      <!-- My Work -->\n      <button style=\"display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;border-radius:10px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <span style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#E7EEFE;flex-shrink:0\"><i data-lucide=\"briefcase\" style=\"width:16px;height:16px;color:#295DEF\"><\u002Fi><\u002Fspan>\n        <span style=\"flex:1;font:500 14px var(--font-sans);color:#1F2937\">My Work<\u002Fspan>\n        <i data-lucide=\"chevron-right\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n      <\u002Fbutton>\n\n      <!-- CDMS -->\n      <button style=\"display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;border-radius:10px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <span style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#FFF1DC;flex-shrink:0\"><i data-lucide=\"database\" style=\"width:16px;height:16px;color:#F08C00\"><\u002Fi><\u002Fspan>\n        <span style=\"flex:1;font:500 14px var(--font-sans);color:#1F2937\">CDMS<\u002Fspan>\n        <i data-lucide=\"chevron-right\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n      <\u002Fbutton>\n\n      <!-- LOS -->\n      <button style=\"display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;border-radius:10px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <span style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#EFEAFD;flex-shrink:0\"><i data-lucide=\"zap\" style=\"width:16px;height:16px;color:#7C5CFC\"><\u002Fi><\u002Fspan>\n        <span style=\"flex:1;font:500 14px var(--font-sans);color:#1F2937\">LOS<\u002Fspan>\n        <i data-lucide=\"chevron-right\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n      <\u002Fbutton>\n\n      <!-- LMS -->\n      <button style=\"display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;border-radius:10px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <span style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#DEF5E9;flex-shrink:0\"><i data-lucide=\"line-chart\" style=\"width:16px;height:16px;color:#0CB559\"><\u002Fi><\u002Fspan>\n        <span style=\"flex:1;font:500 14px var(--font-sans);color:#1F2937\">LMS<\u002Fspan>\n        <i data-lucide=\"chevron-right\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n      <\u002Fbutton>\n\n      <!-- GL -->\n      <button style=\"display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;border-radius:10px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <span style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#FCE4EC;flex-shrink:0\"><i data-lucide=\"book-open\" style=\"width:16px;height:16px;color:#E91E63\"><\u002Fi><\u002Fspan>\n        <span style=\"flex:1;font:500 14px var(--font-sans);color:#1F2937\">GL<\u002Fspan>\n        <i data-lucide=\"chevron-right\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n      <\u002Fbutton>\n\n      <!-- Reports -->\n      <button style=\"display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;border-radius:10px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <span style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#E7E9FE;flex-shrink:0\"><i data-lucide=\"bar-chart-3\" style=\"width:16px;height:16px;color:#4F5BD5\"><\u002Fi><\u002Fspan>\n        <span style=\"flex:1;font:500 14px var(--font-sans);color:#1F2937\">Reports<\u002Fspan>\n        <i data-lucide=\"chevron-right\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n      <\u002Fbutton>\n\n      <!-- AI Agents (new module) -->\n      <button onclick=\"{{ toggleOnyx }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;border-radius:10px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <span style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 135deg at 50% 50%, #295DEF, #0CB559, #FFA22F, #295DEF);flex-shrink:0\"><i data-lucide=\"sparkles\" style=\"width:15px;height:15px;color:#fff\"><\u002Fi><\u002Fspan>\n        <span style=\"flex:1;font:600 14px var(--font-sans);color:#1F2937\">AI Agents<\u002Fspan>\n        <i data-lucide=\"{{ onyxChevron }}\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ onyxOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:2px;padding:2px 0 4px 8px\">\n          <button onclick=\"{{ openAgent }}\" style=\"{{ agentRowStyle }}\">\n            <i data-lucide=\"shield-check\" style=\"width:16px;height:16px;color:{{ agentIconColor }}\"><\u002Fi>\n            <span>Underwriting Agent<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fnav>\n\n    <!-- footer -->\n    <div style=\"display:flex;flex-direction:column;gap:2px;padding-top:8px\">\n      <button style=\"display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 10px;border-radius:8px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <i data-lucide=\"settings-2\" style=\"width:16px;height:16px;color:#525252\"><\u002Fi>\n        <span style=\"font:500 14px var(--font-sans);color:#404040\">Admin<\u002Fspan>\n      <\u002Fbutton>\n      <button style=\"display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 10px;border-radius:8px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <i data-lucide=\"code-2\" style=\"width:16px;height:16px;color:#525252\"><\u002Fi>\n        <span style=\"font:500 14px var(--font-sans);color:#404040\">API Documentation<\u002Fspan>\n      <\u002Fbutton>\n\n      <div style=\"display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:8px;background:#EAF1FE;margin:6px 0\">\n        <i data-lucide=\"calendar-days\" style=\"width:16px;height:16px;color:#295DEF\"><\u002Fi>\n        <span style=\"font:400 13px var(--font-sans);color:#525252\">System: <span style=\"font-weight:600;color:#295DEF\">29 Jun 2026<\u002Fspan><\u002Fspan>\n        <i data-lucide=\"sliders-horizontal\" style=\"width:15px;height:15px;color:#295DEF;margin-left:auto\"><\u002Fi>\n      <\u002Fdiv>\n\n      <button style=\"display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border-radius:10px;background:transparent;border:0;cursor:pointer;text-align:left\" style-hover=\"background:#F1F1F1\">\n        <span style=\"width:30px;height:30px;border-radius:9999px;background:#0CB559;color:#fff;display:flex;align-items:center;justify-content:center;font:600 13px var(--font-sans);flex-shrink:0\">A<\u002Fspan>\n        <span style=\"flex:1;font:500 13px var(--font-sans);color:#0A0A0A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">admin@crego.ai<\u002Fspan>\n        <i data-lucide=\"chevrons-up-down\" style=\"width:15px;height:15px;color:#A3A3A3\"><\u002Fi>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============ MAIN ============ -->\n  <main style=\"flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden\">\n\n    <!-- topbar -->\n    <div style=\"height:56px;flex-shrink:0;border-bottom:1px solid #E5E5E5;display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff\">\n      <button style=\"width:32px;height:32px;border-radius:8px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"background:#F1F1F1\">\n        <i data-lucide=\"panel-left\" style=\"width:18px;height:18px;color:#525252\"><\u002Fi>\n      <\u002Fbutton>\n      <div style=\"width:1px;height:22px;background:#E5E5E5\"><\u002Fdiv>\n\n      <div style=\"flex:1;display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden\">\n        <sc-if value=\"{{ showToggle }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:center;gap:4px;background:#F4F4F5;border-radius:10px;padding:4px\">\n            <button onclick=\"{{ navCases }}\" style=\"{{ casesTabStyle }}\"><i data-lucide=\"folder-open\" style=\"width:15px;height:15px\"><\u002Fi>Cases<\u002Fbutton>\n            <button onclick=\"{{ navTemplates }}\" style=\"{{ templatesTabStyle }}\"><i data-lucide=\"layout-template\" style=\"width:15px;height:15px\"><\u002Fi>Templates<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ processing }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ navCasesHome }}\" style=\"width:32px;height:32px;border-radius:8px;border:1px solid #E5E5E5;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0\" style-hover=\"background:#F5F5F5\"><i data-lucide=\"arrow-left\" style=\"width:16px;height:16px;color:#525252\"><\u002Fi><\u002Fbutton>\n          <span onclick=\"{{ navCasesHome }}\" style=\"font:600 14px var(--font-sans);color:#737373;cursor:pointer\" style-hover=\"color:#295DEF\">Underwriting Agent<\u002Fspan>\n          <span style=\"color:#D4D4D4\">/<\u002Fspan>\n          <span style=\"font:600 13px var(--font-mono);color:#0A0A0A;white-space:nowrap\">{{ thirdCrumb }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- right: templates view -->\n      <sc-if value=\"{{ isTemplates }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid #E5E5E5;background:#fff;width:240px\">\n          <i data-lucide=\"search\" style=\"width:15px;height:15px;color:#A3A3A3\"><\u002Fi>\n          <input placeholder=\"Search templates…\" style=\"border:0;outline:none;background:transparent;font:400 13px var(--font-sans);color:#0A0A0A;width:100%\">\n        <\u002Fdiv>\n        <button onclick=\"{{ refresh }}\" style=\"width:34px;height:34px;border-radius:8px;border:1px solid #E5E5E5;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"background:#F5F5F5\">\n          <i data-lucide=\"rotate-cw\" style=\"width:16px;height:16px;color:#525252\"><\u002Fi>\n        <\u002Fbutton>\n        <button onclick=\"{{ startCreate }}\" style=\"height:34px;padding:0 14px;border-radius:8px;background:#1A1A1A;color:#FAFAFA;border:0;font:600 13px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px\" style-hover=\"opacity:0.9\">\n          <i data-lucide=\"plus\" style=\"width:15px;height:15px\"><\u002Fi> New template\n        <\u002Fbutton>\n      <\u002Fsc-if>\n\n      <!-- right: cases list view -->\n      <sc-if value=\"{{ casesListView }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid #E5E5E5;background:#fff;width:240px\">\n          <i data-lucide=\"search\" style=\"width:15px;height:15px;color:#A3A3A3\"><\u002Fi>\n          <input placeholder=\"Search cases…\" style=\"border:0;outline:none;background:transparent;font:400 13px var(--font-sans);color:#0A0A0A;width:100%\">\n        <\u002Fdiv>\n        <button onclick=\"{{ openNewCase }}\" style=\"height:34px;padding:0 14px;border-radius:8px;background:#1A1A1A;color:#FAFAFA;border:0;font:600 13px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px\" style-hover=\"opacity:0.9\">\n          <i data-lucide=\"plus\" style=\"width:15px;height:15px\"><\u002Fi> New case\n        <\u002Fbutton>\n      <\u002Fsc-if>\n\n      <!-- right: processing view — decision -->\n      <sc-if value=\"{{ processing }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:6px\">\n          <span style=\"font:500 11px var(--font-sans);color:#A3A3A3;text-transform:uppercase;letter-spacing:0.05em\">Decision<\u002Fspan>\n          <span style=\"{{ proc.decisionPillStyle }}\"><span style=\"{{ proc.decisionDotStyle }}\"><\u002Fspan>{{ proc.decisionStateLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:1px;height:22px;background:#E5E5E5\"><\u002Fdiv>\n        <button onclick=\"{{ rejectCase }}\" disabled=\"{{ proc.decideDisabled }}\" style=\"{{ proc.rejectBtnStyle }}\"><i data-lucide=\"x\" style=\"width:15px;height:15px\"><\u002Fi>Reject<\u002Fbutton>\n        <button onclick=\"{{ approveCase }}\" disabled=\"{{ proc.decideDisabled }}\" style=\"{{ proc.approveBtnStyle }}\"><i data-lucide=\"check\" style=\"width:15px;height:15px\"><\u002Fi>Approve<\u002Fbutton>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- scroll area -->\n    <div style=\"flex:1;overflow-y:auto;background:#fff\">\n\n      <!-- ===== TEMPLATES LIST ===== -->\n      <sc-if value=\"{{ isTemplates }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:24px\">\n          <div style=\"position:relative;overflow:hidden;border-radius:14px;padding:20px 24px;margin-bottom:18px;background:radial-gradient(at 8% 18%, rgba(41,93,239,0.55), transparent 46%), radial-gradient(at 88% 12%, rgba(12,181,89,0.42), transparent 46%), radial-gradient(at 72% 95%, rgba(255,162,47,0.38), transparent 45%), radial-gradient(at 25% 92%, rgba(41,93,239,0.30), transparent 45%), #00112B\">\n            <div style=\"position:absolute;width:220px;height:220px;border-radius:9999px;background:radial-gradient(circle, rgba(41,93,239,0.5), transparent 70%);filter:blur(28px);top:-90px;right:60px;animation:drift 9s ease-in-out infinite\"><\u002Fdiv>\n            <div style=\"position:relative;display:flex;align-items:center;gap:14px\">\n              <span style=\"width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;flex-shrink:0\"><i data-lucide=\"sparkles\" style=\"width:20px;height:20px;color:#fff\"><\u002Fi><\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font:700 17px var(--font-sans);color:#fff\">Underwriting Agent<\u002Fspan><span style=\"font:600 10px var(--font-sans);color:#fff;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.25);border-radius:9999px;padding:2px 8px;letter-spacing:0.05em\">AI<\u002Fspan><\u002Fdiv>\n                <div style=\"font:400 13px var(--font-sans);color:rgba(255,255,255,0.72);margin-top:3px\">Define the BRE rule set and required documents the agent uses to assess every case.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:18px\">\n            <div style=\"flex:1;min-width:0\">\n              <h1 style=\"margin:0;font:600 18px var(--font-sans);color:#0A0A0A\">Templates<\u002Fh1>\n              <p style=\"margin:4px 0 0;font:400 13px var(--font-sans);color:#737373\">Define a BRE rule set and its required documents once, then reuse it when creating cases.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:3px;background:#F5F5F5;border-radius:8px;padding:3px\">\n              <button onclick=\"{{ setStatusAll }}\" style=\"{{ statusAllStyle }}\">All<\u002Fbutton>\n              <button onclick=\"{{ setStatusActive }}\" style=\"{{ statusActiveStyle }}\">Active<\u002Fbutton>\n              <button onclick=\"{{ setStatusInactive }}\" style=\"{{ statusInactiveStyle }}\">Inactive<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px\">\n            <sc-for list=\"{{ templates }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <div style=\"border:1px solid #E5E5E5;border-radius:12px;padding:16px;background:#fff;cursor:pointer;transition:background 150ms ease\" style-hover=\"background:#FAFAFA\">\n                <div style=\"display:flex;align-items:flex-start;gap:10px;margin-bottom:6px\">\n                  <h3 style=\"margin:0;flex:1;font:600 15px var(--font-sans);color:#0A0A0A;line-height:1.3\">{{ t.name }}<\u002Fh3>\n                  <span style=\"{{ t.badgeStyle }}\">{{ t.statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:10px\">\n                  <i data-lucide=\"file-text\" style=\"width:13px;height:13px;color:#A3A3A3\"><\u002Fi>\n                  <span style=\"font:500 12px var(--font-mono);color:#737373\">{{ t.bre }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:0 0 14px;font:400 13px var(--font-sans);color:#737373;line-height:1.45\">{{ t.desc }}<\u002Fp>\n                <div style=\"display:flex;gap:8px\">\n                  <span style=\"display:inline-flex;align-items:center;gap:6px;background:#F5F5F5;border-radius:6px;padding:3px 9px;font:500 12px var(--font-sans);color:#525252\"><i data-lucide=\"list-checks\" style=\"width:13px;height:13px;color:#737373\"><\u002Fi>{{ t.params }} parameters<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;gap:6px;background:#F5F5F5;border-radius:6px;padding:3px 9px;font:500 12px var(--font-sans);color:#525252\"><i data-lucide=\"files\" style=\"width:13px;height:13px;color:#737373\"><\u002Fi>{{ t.docs }} documents<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid #F0F0F0\">\n            <span style=\"font:400 13px var(--font-sans);color:#737373\">Showing {{ templateCount }} of {{ templateCount }} templates<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font:400 13px var(--font-sans);color:#737373\">Per page<\u002Fspan>\n              <div style=\"display:flex;gap:3px;background:#F5F5F5;border-radius:8px;padding:3px\">\n                <span style=\"padding:4px 11px;border-radius:6px;background:#fff;color:#0A0A0A;font:500 13px var(--font-sans);box-shadow:0 1px 2px rgba(0,0,0,0.08)\">15<\u002Fspan>\n                <span style=\"padding:4px 11px;border-radius:6px;color:#737373;font:500 13px var(--font-sans);cursor:pointer\">30<\u002Fspan>\n                <span style=\"padding:4px 11px;border-radius:6px;color:#737373;font:500 13px var(--font-sans);cursor:pointer\">50<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== CREATE TEMPLATE (dialog) ===== -->\n      <sc-if value=\"{{ createOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div onclick=\"{{ closeCreate }}\" style=\"position:fixed;inset:0;background:rgba(0,21,85,0.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto\">\n          <div onclick=\"{{ stop }}\" style=\"width:100%;max-width:920px;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,0.32);display:flex;flex-direction:column;max-height:calc(100vh - 80px);overflow:hidden\">\n            <div style=\"display:flex;align-items:flex-start;gap:16px;padding:20px 24px;border-bottom:1px solid #E5E5E5;flex-shrink:0\">\n              <div style=\"flex:1;min-width:0\">\n                <h2 style=\"margin:0;font:600 18px var(--font-sans);color:#0A0A0A\">New template<\u002Fh2>\n                <p style=\"margin:4px 0 0;font:500 12px var(--font-sans);color:#295DEF\">{{ createStepLabel }}<\u002Fp>\n              <\u002Fdiv>\n              <button onclick=\"{{ closeCreate }}\" style=\"width:32px;height:32px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0\" style-hover=\"background:#F1F1F1\"><i data-lucide=\"x\" style=\"width:18px;height:18px;color:#737373\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex:1;overflow-y:auto;padding:24px\">\n\n          <sc-if value=\"{{ createStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <!-- Section: details -->\n          <div style=\"border:1px solid #E5E5E5;border-radius:12px;padding:20px;margin-bottom:16px;background:#fff\">\n            <div style=\"font:600 15px var(--font-sans);color:#0A0A0A;margin-bottom:2px\">Template details<\u002Fdiv>\n            <div style=\"font:400 13px var(--font-sans);color:#737373;margin-bottom:16px\">A clear name helps your team pick the right template when creating a case.<\u002Fdiv>\n            <div>\n              <label style=\"display:block;font:500 13px var(--font-sans);color:#404040;margin-bottom:6px\">Template name<\u002Flabel>\n              <input value=\"{{ name }}\" onchange=\"{{ onName }}\" placeholder=\"e.g. Personal Loan — Salaried\" style=\"width:100%;height:38px;border:1px solid #E5E5E5;border-radius:8px;padding:0 12px;font:400 14px var(--font-sans);color:#0A0A0A;background:#fff\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Section: BRE rule set -->\n          <div style=\"border:1px solid #E5E5E5;border-radius:12px;padding:20px;margin-bottom:16px;background:#fff\">\n            <div style=\"font:600 15px var(--font-sans);color:#0A0A0A;margin-bottom:2px\">BRE rule set<\u002Fdiv>\n            <div style=\"font:400 13px var(--font-sans);color:#737373;margin-bottom:16px\">Upload the rule set PDF. Crego reads it to suggest the parameters below.<\u002Fdiv>\n\n            <sc-if value=\"{{ noFile }}\" hint-placeholder-val=\"{{ true }}\">\n              <button onclick=\"{{ simulateUpload }}\" style=\"width:100%;border:1.5px dashed #D4D4D4;border-radius:10px;padding:26px;background:#FAFAFA;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px\" style-hover=\"background:#F4F4F4\">\n                <span style=\"width:42px;height:42px;border-radius:10px;background:#EAF1FE;display:flex;align-items:center;justify-content:center\"><i data-lucide=\"upload-cloud\" style=\"width:20px;height:20px;color:#295DEF\"><\u002Fi><\u002Fspan>\n                <span style=\"font:500 14px var(--font-sans);color:#0A0A0A\">Click to upload BRE rule set<\u002Fspan>\n                <span style=\"font:400 12px var(--font-sans);color:#A3A3A3\">PDF up to 10 MB<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ breFile }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:12px;border:1px solid #E5E5E5;border-radius:10px;padding:12px 14px;background:#fff\">\n                <span style=\"width:38px;height:38px;border-radius:8px;background:#FDECEA;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><i data-lucide=\"file-text\" style=\"width:18px;height:18px;color:#EA4335\"><\u002Fi><\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:500 14px var(--font-sans);color:#0A0A0A\">{{ breFile.name }}<\u002Fdiv>\n                  <div style=\"font:400 12px var(--font-sans);color:#737373\">{{ breFile.size }} · PDF<\u002Fdiv>\n                <\u002Fdiv>\n                <button onclick=\"{{ removeFile }}\" style=\"width:30px;height:30px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#F1F1F1\"><i data-lucide=\"x\" style=\"width:16px;height:16px;color:#737373\"><\u002Fi><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"margin-top:16px\">\n              <label style=\"display:block;font:500 13px var(--font-sans);color:#404040;margin-bottom:6px\">Extraction prompt <span style=\"color:#A3A3A3;font-weight:400\">(optional)<\u002Fspan><\u002Flabel>\n              <textarea value=\"{{ prompt }}\" onchange=\"{{ onPrompt }}\" rows=\"3\" placeholder=\"e.g. Treat all monetary thresholds as monthly figures and ignore the annexure tables.\" style=\"width:100%;border:1px solid #E5E5E5;border-radius:8px;padding:10px 12px;font:400 14px var(--font-sans);color:#0A0A0A;background:#fff;line-height:1.5\"><\u002Ftextarea>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:16px;display:flex;align-items:center;gap:12px\">\n              <button onclick=\"{{ parseParams }}\" disabled=\"{{ parseDisabled }}\" style=\"{{ parseBtnStyle }}\">\n                <i data-lucide=\"sparkles\" style=\"width:15px;height:15px\"><\u002Fi> Parse parameters\n              <\u002Fbutton>\n              <sc-if value=\"{{ parsed }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display:inline-flex;align-items:center;gap:6px;font:500 13px var(--font-sans);color:#0CB559\"><i data-lucide=\"check-circle-2\" style=\"width:15px;height:15px\"><\u002Fi>Parameters extracted — review in step 2<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ createStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <!-- Section: required documents -->\n          <div style=\"border:1px solid #E5E5E5;border-radius:12px;padding:20px;margin-bottom:16px;background:#fff\">\n            <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:2px\">\n              <div style=\"font:600 15px var(--font-sans);color:#0A0A0A\">Required documents<\u002Fdiv>\n              <span style=\"font:500 13px var(--font-sans);color:#295DEF\">{{ requiredDocCount }} selected<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font:400 13px var(--font-sans);color:#737373;margin-bottom:14px\">Search the catalog of {{ docCatalogCount }} document types and tick the ones to request. Documents used by a parameter are added automatically.<\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid #E5E5E5;border-radius:8px;background:#fff;margin-bottom:10px\">\n              <i data-lucide=\"search\" style=\"width:16px;height:16px;color:#A3A3A3\"><\u002Fi>\n              <input value=\"{{ docSearch }}\" onchange=\"{{ onDocSearch }}\" placeholder=\"Search document types…\" style=\"border:0;outline:none;background:transparent;font:400 14px var(--font-sans);color:#0A0A0A;width:100%\">\n            <\u002Fdiv>\n\n            <div style=\"border:1px solid #E5E5E5;border-radius:10px;max-height:248px;overflow-y:auto\">\n              <sc-for list=\"{{ filteredDocs }}\" as=\"d\" hint-placeholder-count=\"8\">\n                <button onclick=\"{{ toggleDoc }}\" data-doc=\"{{ d.name }}\" style=\"{{ d.rowStyle }}\" style-hover=\"background:#F5F5F5\">\n                  <span style=\"{{ d.boxStyle }}\"><sc-if value=\"{{ d.checked }}\" hint-placeholder-val=\"{{ false }}\"><i data-lucide=\"check\" style=\"width:13px;height:13px;color:#fff\"><\u002Fi><\u002Fsc-if><\u002Fspan>\n                  <span style=\"flex:1;min-width:0\">{{ d.name }}<\u002Fspan>\n                  <sc-if value=\"{{ d.auto }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;align-items:center;gap:4px;font:500 10px var(--font-sans);color:#295DEF;background:#EAF1FE;border-radius:4px;padding:2px 6px;border:1px solid #BBD2FB\"><i data-lucide=\"lock\" style=\"width:10px;height:10px\"><\u002Fi>from parameter<\u002Fspan><\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ noDocMatches }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:24px;text-align:center;font:400 13px var(--font-sans);color:#A3A3A3\">No document types match your search.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ requiredDocCount }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n                <sc-for list=\"{{ selectedChips }}\" as=\"d\" hint-placeholder-count=\"0\">\n                  <span style=\"{{ d.chipStyle }}\">\n                    <span>{{ d.name }}<\u002Fspan>\n                    <sc-if value=\"{{ d.auto }}\" hint-placeholder-val=\"{{ false }}\"><i data-lucide=\"lock\" style=\"width:12px;height:12px;color:#295DEF;margin-left:1px\"><\u002Fi><\u002Fsc-if>\n                    <sc-if value=\"{{ d.removable }}\" hint-placeholder-val=\"{{ true }}\"><button onclick=\"{{ toggleDoc }}\" data-doc=\"{{ d.name }}\" style=\"display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;border:0;background:transparent;cursor:pointer\" style-hover=\"background:#D8E4FD\"><i data-lucide=\"x\" style=\"width:13px;height:13px;color:#295DEF\"><\u002Fi><\u002Fbutton><\u002Fsc-if>\n                  <\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- Section: parameters -->\n          <div style=\"border:1px solid #E5E5E5;border-radius:12px;padding:20px;background:#fff\">\n            <div style=\"display:flex;align-items:flex-start;gap:16px;margin-bottom:4px\">\n              <div style=\"flex:1\">\n                <div style=\"font:600 15px var(--font-sans);color:#0A0A0A\">Parameters<\u002Fdiv>\n                <div style=\"font:400 13px var(--font-sans);color:#737373;margin-top:2px\">Each parameter has an action and data type. Picking a source document adds it to Required documents above.<\u002Fdiv>\n              <\u002Fdiv>\n              <button onclick=\"{{ addParam }}\" style=\"height:34px;padding:0 13px;border-radius:8px;background:#fff;border:1px solid #E5E5E5;color:#1A1A1A;font:600 13px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex-shrink:0\" style-hover=\"background:#F5F5F5\"><i data-lucide=\"plus\" style=\"width:15px;height:15px\"><\u002Fi> Add parameter<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasParams }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px\">\n                <div style=\"display:grid;grid-template-columns:1fr 138px 148px 200px 36px;gap:10px;padding:0 0 8px;border-bottom:1px solid #E5E5E5\">\n                  <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Name<\u002Fspan>\n                  <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Action<\u002Fspan>\n                  <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Data type<\u002Fspan>\n                  <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Extract from<\u002Fspan>\n                  <span><\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ params }}\" as=\"p\" hint-placeholder-count=\"0\">\n                  <div style=\"display:grid;grid-template-columns:1fr 138px 148px 200px 36px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #F2F2F2\">\n                    <input value=\"{{ p.name }}\" data-idx=\"{{ $index }}\" data-field=\"name\" onchange=\"{{ onParamChange }}\" placeholder=\"Parameter name\" style=\"height:36px;border:1px solid #E5E5E5;border-radius:8px;padding:0 10px;font:400 13px var(--font-sans);color:#0A0A0A;background:#fff;width:100%\">\n                    <select value=\"{{ p.action }}\" data-idx=\"{{ $index }}\" data-field=\"action\" onchange=\"{{ onParamChange }}\" style=\"height:36px;border:1px solid #E5E5E5;border-radius:8px;padding:0 8px;font:400 13px var(--font-sans);color:#0A0A0A;background:#fff;width:100%;cursor:pointer\">\n                      <option value=\"extract\">Extract<\u002Foption>\n                      <option value=\"validate\">Validate<\u002Foption>\n                    <\u002Fselect>\n                    <select value=\"{{ p.dataType }}\" data-idx=\"{{ $index }}\" data-field=\"dataType\" onchange=\"{{ onParamChange }}\" style=\"height:36px;border:1px solid #E5E5E5;border-radius:8px;padding:0 8px;font:400 13px var(--font-sans);color:#0A0A0A;background:#fff;width:100%;cursor:pointer\">\n                      <sc-for list=\"{{ dataTypes }}\" as=\"dt\" hint-placeholder-count=\"6\"><option value=\"{{ dt }}\">{{ dt }}<\u002Foption><\u002Fsc-for>\n                    <\u002Fselect>\n                    <select value=\"{{ p.doc }}\" data-idx=\"{{ $index }}\" data-field=\"doc\" onchange=\"{{ onParamChange }}\" style=\"height:36px;border:1px solid #E5E5E5;border-radius:8px;padding:0 8px;font:400 13px var(--font-sans);color:#0A0A0A;background:#fff;width:100%;cursor:pointer\">\n                      <option value=\"\">— none —<\u002Foption>\n                      <sc-for list=\"{{ allDocs }}\" as=\"d\" hint-placeholder-count=\"6\"><option value=\"{{ d }}\">{{ d }}<\u002Foption><\u002Fsc-for>\n                    <\u002Fselect>\n                    <button data-idx=\"{{ $index }}\" onclick=\"{{ removeParam }}\" style=\"width:34px;height:34px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#FDECEA\"><i data-lucide=\"trash-2\" style=\"width:15px;height:15px;color:#737373\"><\u002Fi><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noParams }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:16px;border:1.5px dashed #E0E0E0;border-radius:10px;padding:30px;text-align:center;background:#FAFAFA\">\n                <div style=\"font:500 14px var(--font-sans);color:#525252;margin-bottom:4px\">No parameters yet<\u002Fdiv>\n                <div style=\"font:400 13px var(--font-sans);color:#A3A3A3\">Upload a rule set and parse, or add one manually with the button above.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;padding:16px 24px;border-top:1px solid #E5E5E5;flex-shrink:0\">\n              <sc-if value=\"{{ createStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n                <button onclick=\"{{ createBack }}\" style=\"height:38px;padding:0 14px;border-radius:8px;background:#fff;border:1px solid #E5E5E5;color:#1A1A1A;font:600 13px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px\" style-hover=\"background:#F5F5F5\"><i data-lucide=\"arrow-left\" style=\"width:15px;height:15px\"><\u002Fi> Back<\u002Fbutton>\n              <\u002Fsc-if>\n              <button onclick=\"{{ closeCreate }}\" style=\"margin-left:auto;height:38px;padding:0 16px;border-radius:8px;background:#fff;border:1px solid #E5E5E5;color:#1A1A1A;font:600 13px var(--font-sans);cursor:pointer\" style-hover=\"background:#F5F5F5\">Cancel<\u002Fbutton>\n              <sc-if value=\"{{ createStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n                <button onclick=\"{{ createNext }}\" style=\"height:38px;padding:0 16px;border-radius:8px;background:#1A1A1A;color:#FAFAFA;border:0;font:600 13px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;gap:7px\" style-hover=\"opacity:0.9\">Continue <i data-lucide=\"arrow-right\" style=\"width:15px;height:15px\"><\u002Fi><\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ createStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n                <button onclick=\"{{ saveTemplate }}\" style=\"height:38px;padding:0 16px;border-radius:8px;background:#1A1A1A;color:#FAFAFA;border:0;font:600 13px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;gap:7px\" style-hover=\"opacity:0.9\"><i data-lucide=\"check\" style=\"width:15px;height:15px\"><\u002Fi> Save template<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== CASES LIST ===== -->\n      <sc-if value=\"{{ casesListView }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:24px\">\n          <div style=\"position:relative;overflow:hidden;border-radius:14px;padding:20px 24px;margin-bottom:18px;background:radial-gradient(at 8% 18%, rgba(41,93,239,0.55), transparent 46%), radial-gradient(at 88% 12%, rgba(12,181,89,0.42), transparent 46%), radial-gradient(at 72% 95%, rgba(255,162,47,0.38), transparent 45%), radial-gradient(at 25% 92%, rgba(41,93,239,0.30), transparent 45%), #00112B\">\n            <div style=\"position:absolute;width:220px;height:220px;border-radius:9999px;background:radial-gradient(circle, rgba(12,181,89,0.5), transparent 70%);filter:blur(28px);top:-90px;right:60px;animation:drift 9s ease-in-out infinite\"><\u002Fdiv>\n            <div style=\"position:relative;display:flex;align-items:center;gap:14px\">\n              <span style=\"width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;flex-shrink:0\"><i data-lucide=\"sparkles\" style=\"width:20px;height:20px;color:#fff\"><\u002Fi><\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font:700 17px var(--font-sans);color:#fff\">Underwriting Agent<\u002Fspan><span style=\"font:600 10px var(--font-sans);color:#fff;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.25);border-radius:9999px;padding:2px 8px;letter-spacing:0.05em\">AI<\u002Fspan><\u002Fdiv>\n                <div style=\"font:400 13px var(--font-sans);color:rgba(255,255,255,0.72);margin-top:3px\">Ingests documents, extracts parameters, runs the rule set, and recommends a decision.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;font:600 12px var(--font-sans);color:#737373\"><i data-lucide=\"sliders-horizontal\" style=\"width:14px;height:14px\"><\u002Fi>Filters<\u002Fspan>\n            <select value=\"{{ caseTplFilter }}\" onchange=\"{{ onCaseTplFilter }}\" style=\"{{ filterSelectStyle }}\">\n              <option value=\"all\">All templates<\u002Foption>\n              <sc-for list=\"{{ caseTplOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fselect>\n            <select value=\"{{ caseStatusFilter }}\" onchange=\"{{ onCaseStatusFilter }}\" style=\"{{ filterSelectStyle }}\">\n              <option value=\"all\">All statuses<\u002Foption>\n              <option value=\"processing\">Processing<\u002Foption>\n              <option value=\"completed\">Completed<\u002Foption>\n            <\u002Fselect>\n            <select value=\"{{ caseDecisionFilter }}\" onchange=\"{{ onCaseDecisionFilter }}\" style=\"{{ filterSelectStyle }}\">\n              <option value=\"all\">All decisions<\u002Foption>\n              <option value=\"approved\">Approved<\u002Foption>\n              <option value=\"rejected\">Rejected<\u002Foption>\n              <option value=\"pending\">Pending<\u002Foption>\n            <\u002Fselect>\n            <sc-if value=\"{{ caseFiltersActive }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ clearCaseFilters }}\" style=\"height:34px;padding:0 12px;border-radius:8px;border:1px solid #E5E5E5;background:#fff;cursor:pointer;font:600 13px var(--font-sans);color:#525252;display:inline-flex;align-items:center;gap:6px\" style-hover=\"background:#F5F5F5\"><i data-lucide=\"x\" style=\"width:14px;height:14px\"><\u002Fi>Clear<\u002Fbutton>\n            <\u002Fsc-if>\n            <span style=\"margin-left:auto;font:400 13px var(--font-sans);color:#737373\">{{ caseCountLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E5E5E5;border-radius:12px;overflow:hidden;background:#fff\">\n            <div style=\"display:grid;grid-template-columns:175px 1.1fr 1.3fr 110px 130px 150px;gap:12px;padding:11px 18px;background:#FAFAFA;border-bottom:1px solid #E5E5E5\">\n              <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Case ID<\u002Fspan>\n              <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Applicant<\u002Fspan>\n              <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Template<\u002Fspan>\n              <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Created<\u002Fspan>\n              <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Status<\u002Fspan>\n              <span style=\"font:600 11px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Decision<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ casesView }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div onclick=\"{{ openCaseRow }}\" data-idx=\"{{ c.idx }}\" style=\"display:grid;grid-template-columns:175px 1.1fr 1.3fr 110px 130px 150px;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid #F2F2F2;cursor:pointer\" style-hover=\"background:#FAFAFA\">\n                <span style=\"font:600 13px var(--font-mono);color:#295DEF\">{{ c.id }}<\u002Fspan>\n                <span style=\"font:500 14px var(--font-sans);color:#0A0A0A\">{{ c.applicant }}<\u002Fspan>\n                <span style=\"font:400 13px var(--font-sans);color:#525252\">{{ c.tpl }}<\u002Fspan>\n                <span style=\"font:400 13px var(--font-sans);color:#737373\">{{ c.created }}<\u002Fspan>\n                <span><span style=\"{{ c.statusStyle }}\">{{ c.statusLabel }}<\u002Fspan><\u002Fspan>\n                <span><span style=\"{{ c.decisionStyle }}\">{{ c.decisionLabel }}<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ casesEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:40px 18px;text-align:center;font:400 13px var(--font-sans);color:#A3A3A3\">No cases match the selected filters.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== PROCESSING SCREEN ===== -->\n      <sc-if value=\"{{ processing }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;height:100%\">\n          <!-- split body -->\n          <div style=\"flex:1;display:flex;min-height:0\">\n\n            <!-- LEFT 3/4 -->\n            <div style=\"flex:3;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:#fff\">\n              <div style=\"display:flex;align-items:center;border-bottom:1px solid #E5E5E5;flex-shrink:0;padding:0 8px\">\n                <button onclick=\"{{ setLeftTab }}\" data-tab=\"report\" style=\"{{ proc.leftReportStyle }}\"><i data-lucide=\"file-bar-chart-2\" style=\"width:15px;height:15px\"><\u002Fi>Analysis report<\u002Fbutton>\n                <button onclick=\"{{ setLeftTab }}\" data-tab=\"docs\" style=\"{{ proc.leftDocsStyle }}\"><i data-lucide=\"files\" style=\"width:15px;height:15px\"><\u002Fi>Documents<\u002Fbutton>\n                <button onclick=\"{{ setLeftTab }}\" data-tab=\"info\" style=\"{{ proc.leftInfoStyle }}\"><i data-lucide=\"info\" style=\"width:15px;height:15px\"><\u002Fi>Info<\u002Fbutton>\n                <button onclick=\"{{ setLeftTab }}\" data-tab=\"history\" style=\"{{ proc.leftHistoryStyle }}\"><i data-lucide=\"history\" style=\"width:15px;height:15px\"><\u002Fi>History<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"flex:1;overflow-y:auto;padding:18px;min-height:0\">\n\n                <!-- info tab -->\n                <sc-if value=\"{{ proc.leftIsInfo }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"max-width:720px\">\n                    <div style=\"font:600 15px var(--font-sans);color:#0A0A0A;margin-bottom:12px\">Case details<\u002Fdiv>\n                    <div style=\"border:1px solid #E5E5E5;border-radius:10px;overflow:hidden;margin-bottom:24px\">\n                      <div style=\"display:grid;grid-template-columns:170px 1fr;gap:12px;padding:13px 16px;border-bottom:1px solid #F2F2F2\">\n                        <span style=\"font:500 13px var(--font-sans);color:#737373\">Case ID<\u002Fspan>\n                        <span style=\"font:600 13px var(--font-mono);color:#0A0A0A\">{{ proc.id }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:170px 1fr;gap:12px;padding:13px 16px;border-bottom:1px solid #F2F2F2\">\n                        <span style=\"font:500 13px var(--font-sans);color:#737373\">Applicant<\u002Fspan>\n                        <span style=\"font:500 14px var(--font-sans);color:#0A0A0A\">{{ proc.applicant }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:170px 1fr;gap:12px;padding:13px 16px;border-bottom:1px solid #F2F2F2\">\n                        <span style=\"font:500 13px var(--font-sans);color:#737373\">Template<\u002Fspan>\n                        <span>\n                          <span style=\"display:block;font:500 14px var(--font-sans);color:#0A0A0A\">{{ proc.tplName }}<\u002Fspan>\n                          <span style=\"display:block;font:400 13px var(--font-sans);color:#737373;margin-top:2px\">{{ proc.tplDesc }}<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:170px 1fr;gap:12px;padding:13px 16px;border-bottom:1px solid #F2F2F2\">\n                        <span style=\"font:500 13px var(--font-sans);color:#737373\">Created<\u002Fspan>\n                        <span style=\"font:500 14px var(--font-sans);color:#0A0A0A\">{{ proc.created }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:170px 1fr;gap:12px;padding:13px 16px;align-items:center\">\n                        <span style=\"font:500 13px var(--font-sans);color:#737373\">Status<\u002Fspan>\n                        <span><span style=\"{{ proc.caseStatusStyle }}\">{{ proc.caseStatusLabel }}<\u002Fspan><\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font:600 15px var(--font-sans);color:#0A0A0A;margin-bottom:10px\">Documents provided<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                      <sc-for list=\"{{ proc.docs }}\" as=\"d\" hint-placeholder-count=\"4\">\n                        <span style=\"display:inline-flex;align-items:center;gap:7px;background:#F5F5F5;border-radius:8px;padding:7px 12px;font:500 13px var(--font-sans);color:#404040\"><i data-lucide=\"file-text\" style=\"width:14px;height:14px;color:#737373\"><\u002Fi>{{ d.name }}<\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- documents tab -->\n                <sc-if value=\"{{ proc.leftIsDocs }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div>\n                    <div style=\"display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid #F0F0F0\">\n                      <sc-for list=\"{{ proc.docs }}\" as=\"d\" hint-placeholder-count=\"4\">\n                        <button onclick=\"{{ setSelDoc }}\" data-idx=\"{{ d.idx }}\" style=\"{{ d.rowStyle }}\">\n                          <span style=\"width:32px;height:32px;border-radius:7px;background:#FDECEA;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><i data-lucide=\"file-text\" style=\"width:16px;height:16px;color:#EA4335\"><\u002Fi><\u002Fspan>\n                          <span style=\"min-width:0\">\n                            <span style=\"display:block;font:500 13px var(--font-sans);color:#0A0A0A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ d.name }}<\u002Fspan>\n                            <span style=\"display:block;font:500 11px var(--font-sans);color:{{ d.statusColor }};margin-top:1px\">{{ d.statusText }}<\u002Fspan>\n                          <\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-for>\n                      <button onclick=\"{{ addCaseDoc }}\" title=\"Add a document\" style=\"display:flex;align-items:center;gap:8px;min-width:150px;flex-shrink:0;padding:10px 14px;border-radius:9px;border:1.5px dashed #CBD5E8;background:#fff;cursor:pointer;text-align:left\" style-hover=\"background:#F5F8FF;border-color:#295DEF\">\n                        <span style=\"width:32px;height:32px;border-radius:7px;background:#EAF1FE;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><i data-lucide=\"plus\" style=\"width:16px;height:16px;color:#295DEF\"><\u002Fi><\u002Fspan>\n                        <span style=\"min-width:0\">\n                          <span style=\"display:block;font:600 13px var(--font-sans);color:#295DEF\">Add document<\u002Fspan>\n                          <span style=\"display:block;font:500 11px var(--font-sans);color:#A3A3A3;margin-top:1px\">Upload &amp; classify<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n                        <span style=\"width:30px;height:30px;border-radius:7px;background:#FDECEA;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><i data-lucide=\"file-text\" style=\"width:15px;height:15px;color:#EA4335\"><\u002Fi><\u002Fspan>\n                        <span style=\"font:600 14px var(--font-sans);color:#0A0A0A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0\">{{ proc.preview.name }}<\u002Fspan>\n                        <button onclick=\"{{ setDocViewer }}\" data-mode=\"{{ proc.viewerToggleMode }}\" style=\"background:transparent;border:0;padding:0;cursor:pointer;font:500 11px var(--font-sans);color:#295DEF;display:inline-flex;align-items:center;gap:3px;flex-shrink:0\" style-hover=\"text-decoration:underline\"><i data-lucide=\"{{ proc.viewerToggleIcon }}\" style=\"width:11px;height:11px\"><\u002Fi>{{ proc.viewerToggleLabel }}<\u002Fbutton>\n                        <sc-if value=\"{{ proc.preview.edited }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"margin-left:auto;display:inline-flex;align-items:center;gap:4px;font:600 10px var(--font-sans);color:#B45309;background:#FEF3DC;border:1px solid #F5D998;border-radius:9999px;padding:2px 8px;flex-shrink:0\"><i data-lucide=\"pencil\" style=\"width:10px;height:10px\"><\u002Fi>Edited<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n\n                      <sc-if value=\"{{ proc.isParsed }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"background:#0E1525;border-radius:10px;padding:16px 18px;overflow:auto;max-height:540px\"><pre style=\"margin:0;font:400 12px/1.65 var(--font-mono);color:#C8D3E6;white-space:pre-wrap;word-break:break-word\">{{ proc.preview.parsedJson }}<\u002Fpre><\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ proc.isOriginal }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"max-width:760px;margin:0 auto;background:#fff;border:1px solid #E5E5E5;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,0.06);padding:32px 40px\">\n                          <div style=\"font:700 16px var(--font-sans);color:#0A0A0A\">{{ proc.preview.name }}<\u002Fdiv>\n                          <div style=\"font:400 11px var(--font-mono);color:#A3A3A3;margin:4px 0 22px\">Scanned document · page 1 of 1<\u002Fdiv>\n                          <div style=\"height:9px;border-radius:4px;background:#EFEFEF;width:88%;margin-bottom:9px\"><\u002Fdiv>\n                          <div style=\"height:9px;border-radius:4px;background:#EFEFEF;width:74%;margin-bottom:9px\"><\u002Fdiv>\n                          <div style=\"height:9px;border-radius:4px;background:#EFEFEF;width:80%;margin-bottom:22px\"><\u002Fdiv>\n                          <sc-for list=\"{{ proc.preview.fields }}\" as=\"f\" hint-placeholder-count=\"2\">\n                            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;padding:9px 12px;border-radius:7px;background:#F5F8FF;border:1px solid #BBD2FB\">\n                              <span style=\"font:500 12px var(--font-sans);color:#295DEF\">{{ f.name }}<\u002Fspan>\n                              <span style=\"font:600 13px var(--font-mono);color:#0A0A0A\">{{ f.value }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                          <div style=\"height:9px;border-radius:4px;background:#EFEFEF;width:92%;margin:22px 0 9px\"><\u002Fdiv>\n                          <div style=\"height:9px;border-radius:4px;background:#EFEFEF;width:68%\"><\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- report tab -->\n                <sc-if value=\"{{ proc.leftIsReport }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-if value=\"{{ proc.reportPending }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center\">\n                      <span style=\"display:inline-flex;animation:spin 1s linear infinite;margin-bottom:14px\"><i data-lucide=\"loader-2\" style=\"width:28px;height:28px;color:#9B5FD0\"><\u002Fi><\u002Fspan>\n                      <div style=\"font:600 15px var(--font-sans);color:#0A0A0A\">Generating analysis report…<\u002Fdiv>\n                      <div style=\"font:400 13px var(--font-sans);color:#737373;margin-top:6px;max-width:360px\">Crego is reading the documents and running the rule set. The report will appear here as stages complete.<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ proc.reportReady }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:relative;overflow:hidden;border-radius:14px;border:1px solid #E7E2F5;padding:18px 20px;margin-bottom:18px;background:radial-gradient(at 6% 12%, rgba(181,126,232,0.30), transparent 48%), radial-gradient(at 94% 16%, rgba(63,217,154,0.28), transparent 48%), radial-gradient(at 30% 96%, rgba(94,234,212,0.32), transparent 50%), radial-gradient(at 82% 92%, rgba(103,212,232,0.24), transparent 48%), #FBFBFE\">\n                      <div style=\"position:absolute;width:200px;height:200px;border-radius:9999px;background:radial-gradient(circle, rgba(181,126,232,0.40), transparent 70%);filter:blur(30px);top:-80px;left:40%;animation:drift 9s ease-in-out infinite\"><\u002Fdiv>\n                      <div style=\"position:relative;display:flex;align-items:center;gap:13px\">\n                        <span style=\"width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 130deg at 50% 50%, #B57EE8, #5EEAD4, #3FD99A, #B57EE8)\"><i data-lucide=\"sparkles\" style=\"width:19px;height:19px;color:#fff\"><\u002Fi><\u002Fspan>\n                        <div style=\"flex:1;min-width:0\">\n                          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font:700 15px var(--font-sans);color:#1A1235\">AI analysis report<\u002Fspan><span style=\"font:600 10px var(--font-sans);color:#6D3F9E;background:rgba(181,126,232,0.16);border:1px solid rgba(181,126,232,0.35);border-radius:9999px;padding:2px 8px;letter-spacing:0.05em\">GENERATED<\u002Fspan><\u002Fdiv>\n                          <div style=\"font:400 12px var(--font-sans);color:#5C5470;margin-top:2px\">Synthesised from extracted parameters, the rule engine, and cross-document checks.<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"text-align:right;flex-shrink:0\">\n                          <div style=\"font:700 18px var(--font-sans);color:#1A1235\">{{ proc.rep.decision.confidence }}%<\u002Fdiv>\n                          <div style=\"font:500 11px var(--font-sans);color:#5C5470\">confidence<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px\">\n                      <button onclick=\"{{ setReportSection }}\" data-sec=\"decision\" style=\"{{ proc.rep.secDecisionStyle }}\">Decision<\u002Fbutton>\n                      <button onclick=\"{{ setReportSection }}\" data-sec=\"bre\" style=\"{{ proc.rep.secBreStyle }}\">Rule engine<\u002Fbutton>\n                      <button onclick=\"{{ setReportSection }}\" data-sec=\"risk\" style=\"{{ proc.rep.secRiskStyle }}\">Risk analysis<\u002Fbutton>\n                      <button onclick=\"{{ setReportSection }}\" data-sec=\"docs\" style=\"{{ proc.rep.secDocsStyle }}\">Document checks<\u002Fbutton>\n                    <\u002Fdiv>\n\n                    <!-- DECISION -->\n                    <sc-if value=\"{{ proc.rep.isDecision }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"max-width:760px\">\n                        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\">\n                          <span style=\"{{ proc.rep.decision.verdictStyle }}\">{{ proc.rep.decision.verdictLabel }}<\u002Fspan>\n                          <span style=\"font:500 13px var(--font-sans);color:#737373\">Confidence {{ proc.rep.decision.confidence }}%<\u002Fspan>\n                        <\u002Fdiv>\n                        <p style=\"margin:0 0 20px;font:400 14px var(--font-sans);color:#404040;line-height:1.6\">{{ proc.rep.decision.rationale }}<\u002Fp>\n                        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px\">\n                          <sc-for list=\"{{ proc.rep.decision.params }}\" as=\"p\" hint-placeholder-count=\"3\">\n                            <div style=\"border:1px solid #E5E5E5;border-radius:10px;padding:12px 14px\">\n                              <div style=\"font:500 12px var(--font-sans);color:#737373\">{{ p.label }}<\u002Fdiv>\n                              <div style=\"font:600 16px var(--font-sans);color:#0A0A0A;margin-top:3px\">{{ p.value }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"font:600 13px var(--font-sans);color:#0A0A0A;margin-bottom:8px\">Positives<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:18px\">\n                          <sc-for list=\"{{ proc.rep.decision.positives }}\" as=\"t\" hint-placeholder-count=\"3\">\n                            <div style=\"display:flex;gap:9px\"><i data-lucide=\"check\" style=\"width:16px;height:16px;color:#0F9D58;flex-shrink:0;margin-top:1px\"><\u002Fi><span style=\"font:400 13px var(--font-sans);color:#404040;line-height:1.5\">{{ t }}<\u
