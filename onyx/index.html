002Fspan><\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"font:600 13px var(--font-sans);color:#0A0A0A;margin-bottom:8px\">Concerns<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:20px\">\n                          <sc-for list=\"{{ proc.rep.decision.concerns }}\" as=\"t\" hint-placeholder-count=\"2\">\n                            <div style=\"display:flex;gap:9px\"><i data-lucide=\"triangle-alert\" style=\"width:16px;height:16px;color:#B45309;flex-shrink:0;margin-top:1px\"><\u002Fi><span style=\"font:400 13px var(--font-sans);color:#404040;line-height:1.5\">{{ t }}<\u002Fspan><\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"border:1px solid #BBD2FB;background:#F5F8FF;border-radius:10px;padding:16px\">\n                          <div style=\"font:600 13px var(--font-sans);color:#295DEF;margin-bottom:12px\">Conditions to satisfy<\u002Fdiv>\n                          <div style=\"display:flex;flex-direction:column;gap:11px\">\n                            <sc-for list=\"{{ proc.rep.decision.conditions }}\" as=\"c\" hint-placeholder-count=\"3\">\n                              <div style=\"display:flex;gap:10px\"><span style=\"width:20px;height:20px;border-radius:9999px;background:#295DEF;color:#fff;font:600 11px var(--font-sans);display:flex;align-items:center;justify-content:center;flex-shrink:0\">{{ c.n }}<\u002Fspan><span style=\"font:400 13px var(--font-sans);color:#1F2937;line-height:1.5\">{{ c.text }}<\u002Fspan><\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <!-- RULE ENGINE -->\n                    <sc-if value=\"{{ proc.rep.isBre }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"max-width:760px\">\n                        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\">\n                          <span style=\"{{ proc.rep.bre.verdictStyle }}\">{{ proc.rep.bre.verdictLabel }}<\u002Fspan>\n                          <span style=\"font:500 13px var(--font-sans);color:#737373\">{{ proc.rep.bre.summary }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px\">\n                          <sc-for list=\"{{ proc.rep.bre.stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n                            <div style=\"border:1px solid #E5E5E5;border-radius:10px;padding:12px 14px;text-align:center\">\n                              <div style=\"font:700 22px var(--font-sans);color:{{ st.color }}\">{{ st.value }}<\u002Fdiv>\n                              <div style=\"font:500 12px var(--font-sans);color:#737373;margin-top:2px\">{{ st.label }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"font:600 13px var(--font-sans);color:#0A0A0A;margin-bottom:10px\">Rules evaluated<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:22px\">\n                          <sc-for list=\"{{ proc.rep.bre.rules }}\" as=\"r\" hint-placeholder-count=\"2\">\n                            <div style=\"border:1px solid #E5E5E5;border-radius:10px;padding:14px\">\n                              <div style=\"display:flex;align-items:flex-start;gap:8px;margin-bottom:8px\">\n                                <span style=\"flex:1;font:500 14px var(--font-sans);color:#0A0A0A\">{{ r.rule }}<\u002Fspan>\n                                <span style=\"{{ r.severityStyle }}\">{{ r.severity }}<\u002Fspan>\n                                <span style=\"{{ r.verdictStyle }}\">{{ r.verdictLabel }}<\u002Fspan>\n                              <\u002Fdiv>\n                              <p style=\"margin:0 0 8px;font:400 13px var(--font-sans);color:#525252;line-height:1.5\">{{ r.reasoning }}<\u002Fp>\n                              <span style=\"font:500 12px var(--font-mono);color:#0A0A0A;background:#F5F5F5;border-radius:6px;padding:5px 10px;display:inline-block\">{{ r.math }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"font:600 13px var(--font-sans);color:#0A0A0A;margin-bottom:10px\">Extracted values<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:10px\">\n                          <sc-for list=\"{{ proc.rep.bre.extracted }}\" as=\"e\" hint-placeholder-count=\"2\">\n                            <div style=\"border:1px solid #E5E5E5;border-radius:10px;padding:13px 14px\">\n                              <div style=\"display:flex;align-items:baseline;gap:10px\">\n                                <span style=\"font:500 13px var(--font-mono);color:#525252\">{{ e.key }}<\u002Fspan>\n                                <span style=\"font:700 15px var(--font-mono);color:#0A0A0A;margin-left:auto\">{{ e.value }}<\u002Fspan>\n                              <\u002Fdiv>\n                              <p style=\"margin:6px 0 0;font:400 12px var(--font-sans);color:#737373;line-height:1.5\">{{ e.reference }}<\u002Fp>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <!-- RISK -->\n                    <sc-if value=\"{{ proc.rep.isRisk }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"max-width:760px\">\n                        <div style=\"display:flex;gap:14px;margin-bottom:18px\">\n                          <div style=\"border:1px solid #E5E5E5;border-radius:10px;padding:12px 16px\">\n                            <div style=\"font:500 12px var(--font-sans);color:#737373\">Risk score<\u002Fdiv>\n                            <div style=\"font:700 22px var(--font-sans);color:#0A0A0A;margin-top:2px\">{{ proc.rep.risk.score }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"display:flex;flex-direction:column;gap:8px;justify-content:center\">\n                            <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font:500 12px var(--font-sans);color:#737373;width:64px\">Category<\u002Fspan><span style=\"{{ proc.rep.risk.categoryStyle }}\">{{ proc.rep.risk.category }}<\u002Fspan><\u002Fdiv>\n                            <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font:500 12px var(--font-sans);color:#737373;width:64px\">Outlook<\u002Fspan><span style=\"{{ proc.rep.risk.outlookStyle }}\">{{ proc.rep.risk.outlook }}<\u002Fspan><\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <p style=\"margin:0 0 20px;font:400 14px var(--font-sans);color:#404040;line-height:1.6\">{{ proc.rep.risk.riskSummary }}<\u002Fp>\n                        <div style=\"border:1px solid #E5E5E5;border-radius:10px;padding:16px;margin-bottom:22px\">\n                          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">\n                            <span style=\"font:600 14px var(--font-sans);color:#0A0A0A\">KYC checks<\u002Fspan>\n                            <span style=\"{{ proc.rep.risk.kycVerdictStyle }}\">{{ proc.rep.risk.kycVerdict }}<\u002Fspan>\n                            <span style=\"font:500 12px var(--font-sans);color:#737373;margin-left:auto\">Score {{ proc.rep.risk.kycScore }}<\u002Fspan>\n                          <\u002Fdiv>\n                          <sc-for list=\"{{ proc.rep.risk.kycChecks }}\" as=\"c\" hint-placeholder-count=\"2\">\n                            <div style=\"display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid #F2F2F2\">\n                              <span style=\"font:500 13px var(--font-sans);color:#0A0A0A;width:130px;flex-shrink:0\">{{ c.name }}<\u002Fspan>\n                              <span style=\"{{ c.resultStyle }}\">{{ c.resultLabel }}<\u002Fspan>\n                              <span style=\"font:400 12px var(--font-sans);color:#737373;flex:1;line-height:1.5\">{{ c.message }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:18px\">\n                          <sc-for list=\"{{ proc.rep.risk.lists }}\" as=\"l\" hint-placeholder-count=\"4\">\n                            <div>\n                              <div style=\"font:600 13px var(--font-sans);color:#0A0A0A;margin-bottom:9px\">{{ l.title }}<\u002Fdiv>\n                              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                                <sc-for list=\"{{ l.items }}\" as=\"t\" hint-placeholder-count=\"2\">\n                                  <div style=\"display:flex;gap:10px\"><span style=\"{{ l.dotStyle }}\"><\u002Fspan><span style=\"font:400 13px var(--font-sans);color:#404040;line-height:1.5\">{{ t }}<\u002Fspan><\u002Fdiv>\n                                <\u002Fsc-for>\n                              <\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <!-- DOCUMENT CHECKS -->\n                    <sc-if value=\"{{ proc.rep.isDocs }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"max-width:820px\">\n                        <div style=\"margin-bottom:8px\"><span style=\"{{ proc.rep.docs.overallStyle }}\">Cross-document check<\u002Fspan><\u002Fdiv>\n                        <p style=\"margin:0 0 18px;font:400 14px var(--font-sans);color:#404040;line-height:1.6\">{{ proc.rep.docs.summary }}<\u002Fp>\n                        <div style=\"display:flex;flex-direction:column;gap:14px\">\n                          <sc-for list=\"{{ proc.rep.docs.entities }}\" as=\"en\" hint-placeholder-count=\"3\">\n                            <div style=\"border:1px solid #E5E5E5;border-radius:12px;overflow:hidden\">\n                              <div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;background:#FAFAFA;border-bottom:1px solid #E5E5E5\">\n                                <div style=\"min-width:0\">\n                                  <div style=\"font:600 14px var(--font-sans);color:#0A0A0A\">{{ en.name }}<\u002Fdiv>\n                                  <div style=\"font:400 12px var(--font-sans);color:#737373\">{{ en.meta }}<\u002Fdiv>\n                                <\u002Fdiv>\n                                <span style=\"{{ en.statusStyle }};margin-left:auto\">{{ en.statusLabel }}<\u002Fspan>\n                              <\u002Fdiv>\n                              <div style=\"padding:4px 16px\">\n                                <sc-for list=\"{{ en.comparisons }}\" as=\"cp\" hint-placeholder-count=\"3\">\n                                  <div style=\"display:flex;gap:9px;padding:12px 0;border-bottom:1px solid #F2F2F2\">\n                                    <span style=\"{{ cp.dotStyle }}\"><\u002Fspan>\n                                    <div style=\"flex:1;min-width:0\">\n                                      <div style=\"font:600 13px var(--font-sans);color:#0A0A0A\">{{ cp.field }}<\u002Fdiv>\n                                      <div style=\"font:400 12px var(--font-sans);color:#737373;margin-top:2px;line-height:1.5\">{{ cp.observations }}<\u002Fdiv>\n                                      <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:9px\">\n                                        <sc-for list=\"{{ cp.values }}\" as=\"v\" hint-placeholder-count=\"2\">\n                                          <div style=\"display:flex;gap:8px;align-items:flex-start\">\n                                            <span style=\"{{ v.dotStyle }}\"><\u002Fspan>\n                                            <span style=\"font:500 11px var(--font-sans);color:#737373;width:130px;flex-shrink:0\">{{ v.doc }}<\u002Fspan>\n                                            <span style=\"font:400 12px var(--font-mono);color:#0A0A0A;flex:1;min-width:0;word-break:break-word\">{{ v.value }}<\u002Fspan>\n                                          <\u002Fdiv>\n                                        <\u002Fsc-for>\n                                      <\u002Fdiv>\n                                    <\u002Fdiv>\n                                  <\u002Fdiv>\n                                <\u002Fsc-for>\n                              <\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n\n                <!-- history tab -->\n                <sc-if value=\"{{ proc.leftIsHistory }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"max-width:640px\">\n                    <div style=\"font:600 15px var(--font-sans);color:#0A0A0A;margin-bottom:4px\">Activity history<\u002Fdiv>\n                    <div style=\"font:400 13px var(--font-sans);color:#737373;margin-bottom:18px\">Every agent step and manual change on this case, most recent first.<\u002Fdiv>\n                    <sc-for list=\"{{ proc.history }}\" as=\"h\" hint-placeholder-count=\"5\">\n                      <div style=\"display:flex;gap:13px\">\n                        <div style=\"display:flex;flex-direction:column;align-items:center;align-self:stretch\">\n                          <span style=\"{{ h.dotStyle }}\"><i data-lucide=\"{{ h.icon }}\" style=\"width:15px;height:15px;color:{{ h.iconColor }}\"><\u002Fi><\u002Fspan>\n                          <sc-if value=\"{{ h.showLine }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"{{ h.lineStyle }}\"><\u002Fdiv><\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"padding-bottom:20px;flex:1;min-width:0\">\n                          <div style=\"display:flex;align-items:baseline;gap:8px\">\n                            <span style=\"font:600 14px var(--font-sans);color:#0A0A0A\">{{ h.title }}<\u002Fspan>\n                            <span style=\"margin-left:auto;font:500 12px var(--font-mono);color:#A3A3A3;flex-shrink:0\">{{ h.time }}<\u002Fspan>\n                          <\u002Fdiv>\n                          <div style=\"font:400 13px var(--font-sans);color:#525252;margin-top:2px;line-height:1.5\">{{ h.detail }}<\u002Fdiv>\n                          <div style=\"font:500 11px var(--font-sans);color:#A3A3A3;margin-top:4px\">{{ h.user }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div onmousedown=\"{{ startResize }}\" title=\"Drag to resize\" style=\"width:6px;flex-shrink:0;cursor:col-resize;background:#E5E5E5\" style-hover=\"background:#BBD2FB\"><\u002Fdiv>\n            <div data-rpanel=\"1\" style=\"display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;background:#fff;width:{{ proc.rightPanelWidth }}\">\n              <div style=\"display:flex;border-bottom:1px solid #E5E5E5;flex-shrink:0;padding:0 8px\">\n                <button onclick=\"{{ setRightTab }}\" data-tab=\"params\" style=\"{{ proc.rightParamsStyle }}\"><i data-lucide=\"list-checks\" style=\"width:15px;height:15px\"><\u002Fi>Parameters<\u002Fbutton>\n                <button onclick=\"{{ setRightTab }}\" data-tab=\"stages\" style=\"{{ proc.rightStagesStyle }}\"><i data-lucide=\"git-commit-horizontal\" style=\"width:15px;height:15px\"><\u002Fi>Stages<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"flex:1;overflow-y:auto;padding:6px 16px;min-height:0\">\n\n                <!-- parameters tab -->\n                <sc-if value=\"{{ proc.rightIsParams }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-for list=\"{{ proc.params }}\" as=\"p\" hint-placeholder-count=\"6\">\n                    <div style=\"padding:12px 0;border-bottom:1px solid #F2F2F2\">\n                      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:7px\">\n                        <span style=\"flex:1;font:500 13px var(--font-sans);color:#0A0A0A\">{{ p.name }}<\u002Fspan>\n                        <span style=\"{{ p.actionStyle }}\">{{ p.actionLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n\n                      <sc-if value=\"{{ p.pending }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"display:inline-flex;align-items:center;gap:6px;font:500 12px var(--font-sans);color:#A3A3A3\"><span style=\"display:inline-flex;animation:spin 1s linear infinite\"><i data-lucide=\"loader-2\" style=\"width:12px;height:12px\"><\u002Fi><\u002Fspan>Pending<\u002Fspan>\n                      <\u002Fsc-if>\n\n                      <!-- display mode -->\n                      <sc-if value=\"{{ p.showDisplay }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;align-items:center;gap:8px\">\n                          <sc-if value=\"{{ p.showValue }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"{{ p.valueStyle }}\">{{ p.valueText }}<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ p.showBadge }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"{{ p.badgeStyle }}\"><i data-lucide=\"{{ p.badgeIcon }}\" style=\"width:12px;height:12px\"><\u002Fi>{{ p.badgeText }}<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ p.overridden }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"{{ p.editedTagStyle }}\"><i data-lucide=\"pencil\" style=\"width:10px;height:10px\"><\u002Fi>Edited<\u002Fspan>\n                          <\u002Fsc-if>\n                          <button onclick=\"{{ startParamEdit }}\" data-idx=\"{{ p.idx }}\" data-cur=\"{{ p.curRaw }}\" title=\"Overwrite value\" style=\"margin-left:auto;width:26px;height:26px;border-radius:7px;border:1px solid #E5E5E5;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0\" style-hover=\"background:#F5F5F5\"><i data-lucide=\"pencil\" style=\"width:13px;height:13px;color:#737373\"><\u002Fi><\u002Fbutton>\n                        <\u002Fdiv>\n\n                        <div style=\"display:flex;align-items:center;gap:5px;margin-top:6px\">\n                          <i data-lucide=\"file-text\" style=\"width:12px;height:12px;color:#A3A3A3\"><\u002Fi>\n                          <span style=\"font:500 11px var(--font-sans);color:#A3A3A3\">{{ p.docLabel }}<\u002Fspan>\n                          <span style=\"{{ p.confStyle }}\"><span style=\"{{ p.confDotStyle }}\"><\u002Fspan>{{ p.confText }}<\u002Fspan>\n                        <\u002Fdiv>\n\n                        <div style=\"display:flex;gap:6px;align-items:flex-start;margin-top:7px\"><i data-lucide=\"sparkles\" style=\"width:12px;height:12px;color:#9B5FD0;margin-top:2px;flex-shrink:0\"><\u002Fi><span style=\"font:400 12px var(--font-sans);color:#737373;line-height:1.5\">{{ p.reasoning }}<\u002Fspan><\u002Fdiv>\n\n                        <sc-if value=\"{{ p.isValidate }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"margin-top:9px;padding:9px 10px;border-radius:8px;background:#FBFBFD;border:1px solid #EDEDF2\">\n                            <div style=\"display:flex;align-items:center;gap:5px;margin-bottom:6px\"><i data-lucide=\"scale\" style=\"width:12px;height:12px;color:#737373\"><\u002Fi><span style=\"font:600 10px var(--font-sans);color:#737373;text-transform:uppercase;letter-spacing:0.05em\">Validation logic<\u002Fspan><\u002Fdiv>\n                            <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"{{ p.logicChipStyle }}\">{{ p.logicRule }}<\u002Fspan><span style=\"{{ p.logicVerdictStyle }}\">→ {{ p.logicVerdict }}<\u002Fspan><\u002Fdiv>\n                            <sc-if value=\"{{ p.showLogicEvidence }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:6px;font:500 11px var(--font-mono);color:#737373\">{{ p.logicEvidence }}<\u002Fdiv><\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n\n                        <sc-if value=\"{{ p.overridden }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button onclick=\"{{ toggleParamOrig }}\" data-idx=\"{{ p.idx }}\" style=\"margin-top:6px;background:transparent;border:0;padding:0;cursor:pointer;font:600 11px var(--font-sans);color:#295DEF\">{{ p.origToggleLabel }}<\u002Fbutton>\n                          <sc-if value=\"{{ p.showOrig }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"margin-top:5px;display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px;background:#FAFAFA;border:1px solid #EFEFEF\">\n                              <span style=\"font:500 10px var(--font-sans);color:#A3A3A3;text-transform:uppercase;letter-spacing:0.04em\">AI original<\u002Fspan>\n                              <span style=\"font:500 13px var(--font-mono);color:#737373;text-decoration:line-through\">{{ p.origText }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fsc-if>\n                      <\u002Fsc-if>\n\n                      <!-- edit mode -->\n                      <sc-if value=\"{{ p.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                        <sc-if value=\"{{ p.isExtract }}\" hint-placeholder-val=\"{{ true }}\">\n                          <input value=\"{{ proc.paramDraft }}\" onchange=\"{{ onParamDraft }}\" autofocus=\"{{ true }}\" style=\"width:100%;height:36px;border:1px solid #295DEF;border-radius:8px;padding:0 10px;font:600 14px var(--font-mono);color:#0A0A0A;outline:none;box-sizing:border-box\">\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ p.isValidate }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"display:flex;gap:8px\">\n                            <button onclick=\"{{ setParamDraftVal }}\" data-val=\"pass\" style=\"{{ p.passBtnStyle }}\">Pass<\u002Fbutton>\n                            <button onclick=\"{{ setParamDraftVal }}\" data-val=\"fail\" style=\"{{ p.failBtnStyle }}\">Fail<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <div style=\"display:flex;align-items:center;gap:8px;margin-top:8px\">\n                          <button onclick=\"{{ saveParamEdit }}\" data-idx=\"{{ p.idx }}\" style=\"height:30px;padding:0 13px;border-radius:7px;background:#1A1A1A;color:#fff;border:0;font:600 12px var(--font-sans);cursor:pointer\">Save<\u002Fbutton>\n                          <button onclick=\"{{ cancelParamEdit }}\" style=\"height:30px;padding:0 13px;border-radius:7px;background:#fff;border:1px solid #E5E5E5;color:#525252;font:600 12px var(--font-sans);cursor:pointer\">Cancel<\u002Fbutton>\n                          <sc-if value=\"{{ p.overridden }}\" hint-placeholder-val=\"{{ false }}\">\n                            <button onclick=\"{{ revertParam }}\" data-idx=\"{{ p.idx }}\" style=\"margin-left:auto;background:transparent;border:0;padding:0;cursor:pointer;font:600 12px var(--font-sans);color:#EA4335;display:inline-flex;align-items:center;gap:4px\"><i data-lucide=\"rotate-ccw\" style=\"width:13px;height:13px\"><\u002Fi>Revert<\u002Fbutton>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsc-if>\n\n                <!-- stages tab -->\n                <sc-if value=\"{{ proc.rightIsStages }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:14px 4px\">\n                    <sc-for list=\"{{ proc.stages }}\" as=\"st\" hint-placeholder-count=\"6\">\n                      <div style=\"display:flex;gap:12px\">\n                        <div style=\"display:flex;flex-direction:column;align-items:center;align-self:stretch\">\n                          <div style=\"{{ st.dotStyle }}\">\n                            <sc-if value=\"{{ st.isDone }}\" hint-placeholder-val=\"{{ false }}\"><i data-lucide=\"check\" style=\"width:15px;height:15px;color:#fff\"><\u002Fi><\u002Fsc-if>\n                            <sc-if value=\"{{ st.isActive }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;animation:spin 1s linear infinite\"><i data-lucide=\"loader-2\" style=\"width:13px;height:13px;color:#295DEF\"><\u002Fi><\u002Fspan><\u002Fsc-if>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ st.showLine }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"{{ st.lineStyle }}\"><\u002Fdiv><\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"padding-bottom:20px;flex:1;min-width:0\">\n                          <div style=\"{{ st.labelStyle }}\">{{ st.label }}<\u002Fdiv>\n                          <div style=\"font:400 12px var(--font-sans);color:#A3A3A3;margin-top:2px\">{{ st.note }}<\u002Fdi \u002Fi><\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;overflow-y:auto;padding:24px\">\n          <!-- STEP 1 -->\n          <label style=\"display:block;font:500 13px var(--font-sans);color:#404040;margin-bottom:6px\">Applicant name<\u002Flabel>\n          <input value=\"{{ ncApplicant }}\" onchange=\"{{ ncSetApplicant }}\" placeholder=\"e.g. Rahul Mehta\" style=\"width:100%;height:38px;border:1px solid #E5E5E5;border-radius:8px;padding:0 12px;font:400 14px var(--font-sans);color:#0A0A0A;background:#fff;margin-bottom:20px\">\n\n          <div style=\"margin-bottom:22px\">\n            <label style=\"display:block;font:500 13px var(--font-sans);color:#404040;margin-bottom:6px\">Template<\u002Flabel>\n            <select value=\"{{ ncTplValue }}\" onchange=\"{{ ncSelectTpl }}\" style=\"{{ ncTplSelectStyle }}\">\n              <option value=\"\">Select a template…<\u002Foption>\n              <sc-for list=\"{{ ncTplList }}\" as=\"t\" hint-placeholder-count=\"4\"><option value=\"{{ t.idx }}\">{{ t.name }}<\u002Foption><\u002Fsc-for>\n            <\u002Fselect>\n            <sc-if value=\"{{ ncTplPicked }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-top:8px\">\n                <span style=\"flex:1;min-width:0;font:400 13px var(--font-sans);color:#737373\">{{ ncTplDesc }}<\u002Fspan>\n                <span style=\"font:500 12px var(--font-sans);color:#A3A3A3;white-space:nowrap;flex-shrink:0\">{{ ncTplStats }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"font:600 15px var(--font-sans);color:#0A0A0A;margin-bottom:2px\">Upload documents<\u002Fdiv>\n          <p style=\"margin:0 0 16px;font:400 13px var(--font-sans);color:#737373\">Drop a single ZIP with all documents, or select multiple files at once. Crego classifies and labels each one automatically — no need to tag them yourself.<\u002Fp>\n\n          <sc-if value=\"{{ ncNoUpload }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1.5px dashed #D4D4D4;border-radius:12px;padding:30px 24px;background:#FAFAFA;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center\">\n              <span style=\"width:46px;height:46px;border-radius:12px;background:#EAF1FE;display:flex;align-items:center;justify-content:center;margin-bottom:4px\"><i data-lucide=\"upload-cloud\" style=\"width:22px;height:22px;color:#295DEF\"><\u002Fi><\u002Fspan>\n              <span style=\"font:600 14px var(--font-sans);color:#0A0A0A\">Drop a ZIP or multiple files here<\u002Fspan>\n              <span style=\"font:400 12px var(--font-sans);color:#A3A3A3;margin-bottom:12px\">ZIP, PDF, JPG or PNG · up to 50 MB · classified automatically<\u002Fspan>\n              <div style=\"display:flex;gap:10px\">\n                <button onclick=\"{{ ncUploadZip }}\" style=\"height:36px;padding:0 16px;border-radius:8px;background:#1A1A1A;color:#FAFAFA;border:0;cursor:pointer;font:600 13px var(--font-sans);display:inline-flex;align-items:center;gap:7px\" style-hover=\"opacity:0.9\"><i data-lucide=\"folder-archive\" style=\"width:15px;height:15px\"><\u002Fi> Upload ZIP<\u002Fbutton>\n                <button onclick=\"{{ ncUploadFiles }}\" style=\"height:36px;padding:0 16px;border-radius:8px;background:#fff;border:1px solid #E5E5E5;color:#1A1A1A;cursor:pointer;font:600 13px var(--font-sans);display:inline-flex;align-items:center;gap:7px\" style-hover=\"background:#F5F5F5\"><i data-lucide=\"files\" style=\"width:15px;height:15px\"><\u002Fi> Select files<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ ncHasUpload }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:12px;border:1px solid #BBD2FB;border-radius:10px;padding:14px 16px;background:#F5F8FF\">\n              <span style=\"width:42px;height:42px;border-radius:10px;background:#fff;border:1px solid #BBD2FB;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><i data-lucide=\"{{ ncBundleIcon }}\" style=\"width:20px;height:20px;color:#295DEF\"><\u002Fi><\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:600 14px var(--font-sans);color:#0A0A0A\">{{ ncBundleLabel }}<\u002Fdiv>\n                <div style=\"font:400 12px var(--font-sans);color:#525252;margin-top:2px\">{{ ncBundleMeta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"display:inline-flex;align-items:center;gap:5px;font:600 11px var(--font-sans);color:#295DEF;background:#EAF1FE;border:1px solid #BBD2FB;border-radius:9999px;padding:3px 10px\"><i data-lucide=\"sparkles\" style=\"width:12px;height:12px\"><\u002Fi>Auto-classify on start<\u002Fspan>\n              <button onclick=\"{{ ncRemoveBundle }}\" style=\"width:30px;height:30px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0\" style-hover=\"background:#E2EAFB\"><i data-lucide=\"x\" style=\"width:16px;height:16px;color:#737373\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:10px;padding:16px 24px;border-top:1px solid #E5E5E5;flex-shrink:0\">\n          <button onclick=\"{{ closeNewCase }}\" style=\"margin-left:auto;height:38px;padding:0 16px;border-radius:8px;background:#fff;border:1px solid #E5E5E5;color:#1A1A1A;font:600 13px var(--font-sans);cursor:pointer\" style-hover=\"background:#F5F5F5\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ startAnalysis }}\" style=\"{{ ncStartStyle }}\"><i data-lucide=\"sparkles\" style=\"width:15px;height:15px\"><\u002Fi> Start analysis<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- toast -->\n  <sc-if value=\"{{ toast }}\" hint-placeholde ','Bank Statement','CIBIL Report'],\n      paramList:[\n        {name:'Monthly Income', action:'extract', dataType:'Currency', doc:'Salary Slip', value:'₹85,000'},\n        {name:'Net Monthly Obligations', action:'extract', dataType:'Currency', doc:'Bank Statement', value:'₹18,400'},\n        {name:'CIBIL Score', action:'extract', dataType:'Number', doc:'CIBIL Report', value:'762'},\n        {name:'Employment Type', action:'extract', dataType:'Text', doc:'Salary Slip', value:'Salaried — Private'},\n        {name:'Age within 23–58', action:'validate', dataType:'Number', doc:'Aadhaar Card', result:'pass'},\n        {name:'KYC name match', action:'validate', dataType:'Boolean', doc:'PAN Card', result:'pass'},\n        {name:'CIBIL ≥ 700', action:'validate', dataType:'Number', doc:'CIBIL Report', result:'pass'},\n        {name:'FOIR ≤ 50%', action:'validate', dataType:'Percentage', doc:'Bank Statement', result:'pass'},\n      ]},\n    {name:'Business Loan — MSME', bre:'MSME_BRE_2026.pdf', desc:'Turnover, GST and banking behaviour for MSME borrowers.', status:'active',\n      docList:['PAN Card','GST Returns','Bank Statement','ITR','Business Registration'],\n      paramList:[\n        {name:'Annual Turnover', action:'extract', dataType:'Currency', doc:'GST Returns', value:'₹2.4 Cr'},\n        {name:'Avg Monthly Balance', action:'extract', dataType:'Currency', doc:'Bank Statement', value:'₹6,12,000'},\n        {name:'Net Profit Margin', action:'extract', dataType:'Percentage', doc:'ITR', value:'14.2%'},\n        {name:'Years in Business', action:'extract', dataType:'Number', doc:'Business Registration', value:'7'},\n        {name:'GST filing regular', action:'validate', dataType:'Boolean', doc:'GST Returns', result:'pass'},\n        {name:'Turnover ≥ ₹1 Cr', action:'validate', dataType:'Currency', doc:'GST Returns', result:'pass'},\n        {name:'Bureau check clear', action:'validate', dataType:'Number', doc:'', result:'fail'},\n      ]},\n    {name:'Home Loan — Standard
